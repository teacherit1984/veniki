<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Веников</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Магазин Веников "У Ивана"</h1>
        <p>Лучшие веники для бани и дома</p>
    </header>

    <main>
        <section class="products">
            <!-- Карточка 1 -->
            <div class="product-card">
                <h2>Веник Березовый</h2>
                <p class="price">500 руб.</p>
                <button class="buy-btn" data-product="Березовый">Купить</button>
            </div>
            <!-- Карточка 2 -->
            <div class="product-card">
                <h2>Веник Дубовый</h2>
                <p class="price">600 руб.</p>
                <button class="buy-btn" data-product="Дубовый">Купить</button>
            </div>
            <!-- Карточка 3 -->
            <div class="product-card">
                <h2>Веник Эвкалиптовый</h2>
                <p class="price">700 руб.</p>
                <button class="buy-btn" data-product="Эвкалиптовый">Купить</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Все права защищены.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
